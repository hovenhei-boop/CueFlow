[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cueflow"
version = "0.1.1"
description = "Content-addressed subtitle generation and QA engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rfc8785>=0.1,<1",
]

[project.optional-dependencies]
local = [
  "qwen-asr==0.0.6",
]
cloud = [
  "openai>=2,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
cueflow = "cueflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cueflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/cueflow"]
